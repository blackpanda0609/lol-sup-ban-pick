name: Collect match data

on:
  schedule:
    - cron: "0 18 * * *" # 毎日 3:00 (日本時間)
  workflow_dispatch:
    inputs:
      minutes:
        description: "集める時間（分）。テストなら 10"
        default: "300"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collect
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          MAX_MINUTES: ${{ inputs.minutes || '300' }}
        run: python collector/collect.py
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: $(date -u +%F)"
          git pull --rebase
          git push
